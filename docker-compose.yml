version: '3.8'

services:
  postgres:
    image: postgres:17
    container_name: postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: notifications_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

  phppgadmin:
    image: dockage/phppgadmin
    container_name: phppgadmin
    restart: always
    ports:
      - "8080:80"
    environment:
      PHP_PG_ADMIN_SERVER_HOST: postgres
      PHP_PG_ADMIN_SERVER_PORT: 5432
      PHP_PG_ADMIN_DEFAULT_USER: postgres
      PHP_PG_ADMIN_DEFAULT_PASSWORD: postgres
    depends_on:
      - postgres

  app:
    build: .
    container_name: notification-app
    depends_on:
      - postgres
      - rabbitmq
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/notifications_db?schema=public
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672

volumes:
  pgdata:
